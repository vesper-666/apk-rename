name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法检查
        run: python -m py_compile backend/server.py backend/axml.py backend/assets.py

      - name: 构建 Docker 镜像
        run: docker build -f backend/Dockerfile -t apk-rename:ci backend
